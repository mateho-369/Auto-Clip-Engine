# Render Blueprint — https://render.com/docs/blueprint-spec
# On render.com: New -> Blueprint -> connect this repo -> Render reads this file automatically.
services:
  - type: web
    name: auto-clip-engine
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
