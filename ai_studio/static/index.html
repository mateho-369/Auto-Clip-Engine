<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khmer AI Content Studio · ស្ទូឌីយោវីដេអូ</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎬</text></svg>">
</head>
<body>
<div id="boot">
  <div class="boot-card">
    <div class="boot-logo">🎬</div>
    <div class="boot-title">Khmer AI Content Studio</div>
    <div class="boot-sub">កំពុងផ្ទុក… loading the director console</div>
  </div>
</div>

<div id="app" hidden>
  <header id="topbar">
    <div class="brand" data-nav="projects">
      <span class="brand-mark">🎬</span>
      <span class="brand-text">Khmer AI Content Studio</span>
      <span class="brand-sub">director-led local pipeline</span>
    </div>
    <nav class="tabs">
      <button class="tab" data-nav="projects">Projects <span class="mut" data-count="projects"></span></button>
      <button class="tab" data-nav="new">New</button>
      <button class="tab" data-nav="voices">Voices</button>
      <button class="tab" data-nav="memory">Memory</button>
      <button class="tab" data-nav="settings">Settings</button>
    </nav>
    <div class="topbar-right">
      <span id="machine-pill" class="pill" title="detected hardware profile">…</span>
      <span id="plan-pill" class="pill" title="what each stage will actually run">…</span>
      <span id="live-dot" class="dot off" title="live event stream"></span>
    </div>
  </header>

  <div class="banner" id="plan-banner" hidden></div>

  <main id="view"></main>

  <div id="toasts"></div>
  <div id="modal" hidden><div class="modal-box" id="modal-box"></div></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
